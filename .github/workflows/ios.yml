name: iOS Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: macos-26
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
      with:
        xcode-version: "26" 
      
    - name: Show Xcode version
      run: xcodebuild -version

    - name: Install SwiftLint
      env:
        SWIFTLINT_VERSION: 0.65.1
        SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
      run: |
        curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
          "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
        echo "${SWIFTLINT_SHA256}  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
        unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
        echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

    # Any error fails the build; warnings are reported but don't block
    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging

    # Alternative: Keep caching with better invalidation
    # Uncomment the following section if you want to keep caching
    # - name: Cache derived data (with aggressive invalidation)
    #   uses: actions/cache@v3
    #   with:
    #     path: ~/Library/Developer/Xcode/DerivedData
    #     key: ${{ runner.os }}-derived-data-${{ github.sha }}-${{ hashFiles('**/*.swift', '**/*.h', '**/*.m', '**/*.mm', '**/*.c', '**/*.cpp', '**/*.xcodeproj/**', '**/*.xcworkspace/**') }}
    #     restore-keys: |
    #       ${{ runner.os }}-derived-data-${{ github.sha }}-
    #       ${{ runner.os }}-derived-data-
      
    - name: Clean derived data and build artifacts
      run: |
        # Remove all derived data
        rm -rf ~/Library/Developer/Xcode/DerivedData
        rm -rf ~/Library/Caches/com.apple.dt.Xcode
        
        # Clean Xcode build folder for the main scheme only
        xcodebuild clean -scheme gr4vy-swift -configuration Debug
        
        # Clean any remaining build artifacts
        find . -name "*.build" -type d -exec rm -rf {} + 2>/dev/null || true
        find . -name "*.xcuserdata" -type d -exec rm -rf {} + 2>/dev/null || true
        
        # Clean test-specific artifacts
        find . -name "TestResults.xcresult" -type d -exec rm -rf {} + 2>/dev/null || true
        find . -name "*.xcresult" -type d -exec rm -rf {} + 2>/dev/null || true
    
    - name: Resolve SPM (prewarm)
      run: xcodebuild -resolvePackageDependencies -scheme gr4vy-swift

    - name: Find and Boot Latest iOS Simulator
      id: simulator
      run: |
        # Get the latest available iOS simulator
        SIMULATOR_ID=$(xcrun simctl list devices available | grep -i "iphone" | grep -v "unavailable" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
        if [ -n "$SIMULATOR_ID" ]; then
          echo "Found simulator ID: $SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || echo "Simulator already booted"
          echo "id=$SIMULATOR_ID" >> $GITHUB_OUTPUT
        else
          echo "No simulator found, using default iPhone 15"
          echo "id=" >> $GITHUB_OUTPUT
        fi

    - name: Build SDK
      run: |
        xcodebuild build \
          -scheme gr4vy-swift \
          -sdk iphonesimulator \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
    
    - name: Run tests
      run: |
        SIMULATOR_ID="${{ steps.simulator.outputs.id }}"
        if [ -n "$SIMULATOR_ID" ]; then
          DESTINATION="platform=iOS Simulator,id=$SIMULATOR_ID"
        else
          DESTINATION="platform=iOS Simulator,name=iPhone 15"
        fi
        xcodebuild test \
          -scheme gr4vy-swiftTests \
          -destination "$DESTINATION" \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

  ci-complete:
    needs: [build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Verify all jobs passed
      env:
        BUILD_AND_TEST: ${{ needs.build-and-test.result }}
      run: |
        if [ "$BUILD_AND_TEST" != "success" ]; then
          echo "build-and-test result: $BUILD_AND_TEST"
          exit 1
        fi

  notify:
    needs: [ci-complete]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Check out main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Work out the message
      id: message
      env:
        CI_RESULT: ${{ needs.ci-complete.result }}
      run: |
        VERSION=$(tr -d '[:space:]' < VERSION)
        if [ "$CI_RESULT" != "success" ]; then
          echo "text=CI failed on main: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "color=failure" >> "$GITHUB_OUTPUT"
        elif [[ $VERSION =~ ^[0-9A-Za-z.+-]+$ ]] && [ -z "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
          echo "text=$VERSION is ready to release. Run the Release workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml" >> "$GITHUB_OUTPUT"
          echo "color=#F3AB0E" >> "$GITHUB_OUTPUT"
        fi

    - name: Slack Notification
      if: steps.message.outputs.text != ''
      uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
      env:
        SLACK_USERNAME: Swift SDK
        SLACK_TITLE: Swift SDK
        SLACK_WEBHOOK: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
        SLACK_CHANNEL: sdk-updates
        SLACK_MSG_AUTHOR: gr4vy
        SLACK_ICON_EMOJI: ":gr4vy-sdk:"
        SLACK_COLOR: ${{ steps.message.outputs.color }}
        SLACK_MESSAGE: ${{ steps.message.outputs.text }}
        SLACK_FOOTER: ""
