name: Release

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION is '$VERSION', which isn't a semantic version"
            exit 1
          fi
          if ! grep -q "static let current = \"$VERSION\"" gr4vy-swift/Version.swift; then
            echo "::error::gr4vy-swift/Version.swift doesn't say $VERSION. Run ./update_version.sh $VERSION."
            exit 1
          fi
          TAGGED=$(git rev-parse -q --verify "refs/tags/$VERSION^{commit}" || true)
          if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "::error::$VERSION is already tagged on $TAGGED. Bump VERSION with ./update_version.sh first."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci-complete" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.completed_at) | last | .conclusion // "missing"')
          if [ "$RESULT" != "success" ]; then
            echo "::error::ci-complete on $GITHUB_SHA is $RESULT. Wait for CI on main to pass."
            exit 1
          fi

      - name: List what this release ships
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          RANGE=${PREVIOUS:+$PREVIOUS..}$GITHUB_SHA
          {
            echo "## Release $VERSION"
            echo
            echo "Commit \`$GITHUB_SHA\`, changes since ${PREVIOUS:-the first commit}."
            echo
            echo "| PR | Author | Approved by |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for COMMIT in $(git rev-list --first-parent "$RANGE"); do
            PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" --jq '.[0].number // empty')
            if [ -z "$PR" ]; then
              echo "| \`${COMMIT:0:7}\` (no PR) | $(git log -1 --format=%an "$COMMIT") | **nobody** |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"| #\(.number) \(.title | gsub("\\|"; "\\\\|")) | \(.user.login) "' \
              | tr -d '\n' >> "$GITHUB_STEP_SUMMARY"
            APPROVERS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
              --jq '[.[] | select(.state == "APPROVED") | .user.login] | unique | join(", ")')
            echo "| ${APPROVERS:-**nobody**} |" >> "$GITHUB_STEP_SUMMARY"
          done
          SENSITIVE=$(git diff --name-only "$RANGE" -- .github Package.swift Package.resolved gr4vy-swift.xcodeproj scripts update_version.sh)
          if [ -n "$SENSITIVE" ]; then
            {
              echo
              echo "**Changed paths a person must always review:**"
              echo
              echo "$SENSITIVE" | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Get a release token from Octo STS
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: gr4vy
          identity: gr4vy-swift-release

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          TAGGED=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '.object.sha' 2>/dev/null || true)
          if [ -z "$TAGGED" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA" --silent
          elif [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "::error::$VERSION is already tagged on $TAGGED"
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi
          PRERELEASE=()
          if [[ $VERSION == *-* ]]; then PRERELEASE=(--prerelease); fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$VERSION" --generate-notes "${PRERELEASE[@]}"
